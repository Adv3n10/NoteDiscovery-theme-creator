<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoteDiscovery Theme Creator</title>
<style>
/* ============================================================
   Theme Creator chrome (neutral, never affected by the theme being edited)
   ============================================================ */
:root {
  --c-bg: #f4f5f7; --c-panel: #ffffff; --c-text: #1b1f27; --c-muted: #5f6877; --c-line: #dfe2e8;
  --c-accent: #4f46e5; --c-accent-ink: #ffffff; --c-field: #f4f5f7; --c-warn: #b45309; --c-ok: #15803d; --c-bad: #b91c1c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --c-bg: #14161b; --c-panel: #1c1f26; --c-text: #e8eaf0; --c-muted: #9aa3b2; --c-line: #2b303a;
    --c-accent: #8b93ff; --c-accent-ink: #11131a; --c-field: #14161b; --c-warn: #fbbf24; --c-ok: #4ade80; --c-bad: #f87171;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { display: flex; flex-direction: column; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--c-bg); color: var(--c-text); }
button, input, select, textarea { font: inherit; color: inherit; }
.tc-top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--c-panel); border-bottom: 1px solid var(--c-line); flex-wrap: wrap; }
.tc-top h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .01em; }
.tc-top .sp { flex: 1; }
.btn { border: 1px solid var(--c-line); background: var(--c-panel); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--c-accent); }
.btn.primary { background: var(--c-accent); color: var(--c-accent-ink); border-color: var(--c-accent); font-weight: 600; }
.btn.small { padding: 3px 8px; font-size: 12px; }
select.btn { padding-right: 6px; }
.tc-main { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 0; flex: 1; min-height: 0; }
.tc-side { overflow-y: auto; padding: 14px 16px 40px; background: var(--c-panel); border-right: 1px solid var(--c-line); }
.tc-stage { overflow-y: auto; padding: 16px; }
@media (max-width: 980px) { body { display: block; } .tc-main { grid-template-columns: 1fr; } .tc-side { border-right: 0; border-bottom: 1px solid var(--c-line); } }
.sec { margin-bottom: 18px; }
.sec > h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--c-muted); margin: 0 0 8px; display: flex; align-items: center; gap: 10px; }
.sec > h2 .grow { flex: 1; }
.sec > h2 label { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.field { display: flex; flex-direction: column; gap: 3px; margin-bottom: 8px; }
.field > span { font-size: 12px; color: var(--c-muted); }
.field input[type=text], .field textarea { width: 100%; border: 1px solid var(--c-line); background: var(--c-field); border-radius: 6px; padding: 6px 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 70px; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--c-line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 12px; cursor: pointer; }
.seg button.on { background: var(--c-accent); color: var(--c-accent-ink); }
.hint { font-size: 12px; color: var(--c-muted); margin-top: 4px; }
.row { display: grid; grid-template-columns: 34px 1fr 96px; gap: 4px 10px; align-items: center; padding: 5px 6px; border-radius: 8px; }
.row:hover { background: var(--c-field); }
.row .sw { width: 34px; height: 30px; padding: 0; border: 1px solid var(--c-line); border-radius: 6px; background: none; cursor: pointer; }
.row .nm { min-width: 0; }
.row .nm b { display: block; font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .nm small { color: var(--c-muted); font-size: 12px; }
.row input.hex { width: 96px; border: 1px solid var(--c-line); background: var(--c-field); border-radius: 6px; padding: 5px 6px; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
.row input.hex.bad { border-color: var(--c-bad); }
.row .extra { grid-column: 2 / 4; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--c-muted); }
.row .extra input[type=range] { flex: 1; }
.chip { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--c-line); color: var(--c-muted); white-space: nowrap; }
.chip.ok { color: var(--c-ok); border-color: currentColor; } .chip.mid { color: var(--c-warn); border-color: currentColor; } .chip.bad { color: var(--c-bad); border-color: currentColor; }
.quick { display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 8px; align-items: end; }
.quick label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--c-muted); }
.quick input[type=color] { width: 100%; height: 34px; border: 1px solid var(--c-line); border-radius: 6px; padding: 0; background: none; cursor: pointer; }
.stage-card { background: var(--c-panel); border: 1px solid var(--c-line); border-radius: 12px; padding: 12px; margin-bottom: 16px; }
.stage-card > h3 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--c-muted); display: flex; align-items: center; gap: 8px; }
.stage-card > h3 .sp { flex: 1; }
.badge-type { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--c-field); border: 1px solid var(--c-line); text-transform: none; letter-spacing: 0; }
dialog { border: 1px solid var(--c-line); border-radius: 14px; background: var(--c-panel); color: var(--c-text); padding: 0; width: min(860px, 94vw); max-height: 90vh; }
dialog::backdrop { background: rgba(0,0,0,.55); }
.dlg-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--c-line); }
.dlg-head h2 { margin: 0; font-size: 16px; flex: 1; }
.dlg-body { padding: 16px 18px; overflow-y: auto; max-height: calc(90vh - 130px); }
.dlg-foot { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--c-line); flex-wrap: wrap; }
.code { background: var(--c-field); border: 1px solid var(--c-line); border-radius: 8px; padding: 12px; font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; overflow: auto; max-height: 340px; margin: 6px 0 12px; user-select: all; }
.issues { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 4px; }
.issues li { font-size: 13px; padding: 6px 10px; border-radius: 8px; background: var(--c-field); border-left: 3px solid var(--c-ok); }
.issues li.warn { border-left-color: var(--c-warn); } .issues li.err { border-left-color: var(--c-bad); }
ol.steps { padding-left: 20px; margin: 6px 0 0; } ol.steps li { margin-bottom: 8px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--c-text); color: var(--c-bg); padding: 8px 14px; border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; }
.toast.on { opacity: 1; }

/* ============================================================
   NoteDiscovery app replica — rules below are copied from
   frontend/index.html so the preview behaves like the real app
   ============================================================ */
.nd-app { display: flex; height: 640px; overflow: hidden; border-radius: 10px; border: 1px solid var(--border-primary); background-color: var(--bg-primary); color: var(--text-primary); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; line-height: 1.4; }
.nd-app * { box-sizing: border-box; }
.nd-app button, .nd-app input { color: inherit; }
.editor-textarea, .syntax-overlay { font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', 'Consolas', monospace; font-size: 14px; line-height: 1.6; tab-size: 2; letter-spacing: normal; word-spacing: normal; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: break-word; padding: 1.5rem; margin: 0; border: none; box-sizing: border-box; }
.syntax-overlay { color: var(--text-primary); background-color: var(--bg-primary); }
.syntax-overlay .md-heading   { color: var(--accent-primary); }
.syntax-overlay .md-bold      { color: var(--syntax-bold, #fbbf24); }
.syntax-overlay .md-italic    { color: var(--syntax-italic, #a78bfa); }
.syntax-overlay .md-code      { color: var(--accent-secondary, var(--accent-primary)); background: var(--bg-tertiary); border-radius: 2px; }
.syntax-overlay .md-link      { color: var(--link-color, var(--accent-primary)); }
.syntax-overlay .md-link-url  { color: var(--text-tertiary); }
.syntax-overlay .md-list      { color: var(--accent-primary); }
.syntax-overlay .md-blockquote{ color: var(--text-tertiary); }
.syntax-overlay .md-hr        { color: var(--border-primary); }
.syntax-overlay .md-wikilink  { color: var(--link-internal, var(--accent-primary)); }
.syntax-overlay .md-frontmatter { color: var(--text-tertiary); }
.syntax-overlay .md-codeblock { color: var(--text-secondary); background: var(--bg-tertiary); }
.folder-item { user-select: none; border-radius: 6px; border-left: 3px solid transparent; margin-left: 2px; }
.folder-item:hover { background-color: var(--bg-hover); border-left-color: var(--accent-primary); }
.folder-expanded { font-weight: 600; }
.note-item { border-radius: 6px; border-left: 3px solid transparent; margin-left: 2px; }
.note-item:hover, .note-item.is-hover { background-color: var(--bg-hover); border-left-color: var(--accent-primary); transform: translateX(2px); }
.note-item.active { border-left-color: var(--accent-primary) !important; font-weight: 500; }
.icon-rail { width: 44px; min-width: 44px; display: flex; flex-direction: column; align-items: center; padding: 8px 0; background-color: var(--bg-tertiary); border-right: 1px solid var(--border-primary); }
.icon-rail-btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 8px; margin-bottom: 4px; cursor: pointer; transition: background-color .15s ease, color .15s ease; color: var(--text-tertiary); background: transparent; border: none; }
.icon-rail-btn:hover { background-color: var(--bg-hover); color: var(--text-primary); }
.icon-rail-btn.active { background-color: var(--accent-light); color: var(--accent-primary); }
.icon-rail-btn svg { width: 20px; height: 20px; }
.icon-rail-spacer { flex: 1; }
.format-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 4px; cursor: pointer; color: var(--text-secondary); background: transparent; border: none; font-size: 13px; }
.format-btn:hover { background-color: var(--bg-hover); color: var(--text-primary); }
.format-btn:active { background-color: var(--accent-light); color: var(--accent-primary); }
.sidebar-panel { width: 214px; min-width: 214px; display: flex; flex-direction: column; background-color: var(--bg-secondary); border-right: 1px solid var(--border-primary); }
/* app-specific glue for the replica (the real app uses Tailwind utilities for these) */
.nd-head { display: flex; align-items: center; justify-content: space-between; padding: 8px; border-bottom: 1px solid var(--border-primary); }
.nd-head .lbl { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text-tertiary); }
.nd-new { padding: 4px 8px; font-size: 12px; font-weight: 500; color: #fff; border: 0; border-radius: 4px; background-color: var(--accent-primary); display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.nd-new:hover { background-color: var(--accent-hover); }
.nd-search { margin: 8px; padding: 6px 8px; font-size: 13px; border-radius: 6px; border: 1px solid var(--border-primary); background: var(--bg-primary); color: var(--text-primary); width: calc(100% - 16px); }
.nd-search::placeholder { color: var(--text-tertiary); }
.nd-search:focus { outline: 2px solid var(--accent-primary); outline-offset: -1px; }
.nd-tree { padding: 4px 8px 8px; overflow: hidden; }
.nd-sec { padding: 6px 8px 4px; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text-tertiary); }
.nd-row { display: flex; align-items: center; gap: 6px; padding: 5px 8px; font-size: 13px; color: var(--text-primary); cursor: pointer; }
.nd-row .meta { margin-left: auto; font-size: 11px; color: var(--text-tertiary); }
.nd-row.indent { padding-left: 24px; }
.note-item.active { background-color: var(--accent-light); }
.nd-tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--accent-light); color: var(--accent-primary); }
.nd-main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg-primary); }
.nd-toolbar { display: flex; align-items: center; gap: 4px; padding: 6px 10px; border-bottom: 1px solid var(--border-primary); background: var(--bg-secondary); }
.nd-toolbar .title { font-weight: 600; font-size: 13px; margin-right: 10px; color: var(--text-primary); }
.nd-toolbar .sep { width: 1px; height: 18px; background: var(--border-primary); margin: 0 6px; }
.nd-toolbar .modes { margin-left: auto; display: inline-flex; border: 1px solid var(--border-primary); border-radius: 6px; overflow: hidden; }
.nd-toolbar .modes button { border: 0; background: transparent; padding: 3px 10px; font-size: 12px; color: var(--text-secondary); cursor: pointer; }
.nd-toolbar .modes button:hover { background: var(--bg-hover); color: var(--text-primary); }
.nd-toolbar .modes button.on { background: var(--accent-primary); color: #fff; }
.nd-split { flex: 1; min-height: 0; display: flex; container-type: inline-size; }
.nd-edit { flex: 1 1 50%; min-width: 0; position: relative; overflow: auto; background: var(--bg-primary); }
.nd-prev { flex: 1 1 50%; min-width: 0; overflow: auto; padding: 1.5rem; border-left: 1px solid var(--border-primary); background: var(--bg-primary); }
.nd-prev .markdown-preview { font-size: 14px; }
.nd-status { display: flex; align-items: center; gap: 12px; padding: 4px 12px; font-size: 11px; color: var(--text-tertiary); background: var(--bg-secondary); border-top: 1px solid var(--border-primary); }
.nd-status .active-bg { background: var(--bg-active); color: var(--text-primary); padding: 0 6px; border-radius: 4px; }
.nd-app ::-webkit-scrollbar { width: 10px; height: 10px; }
.nd-app ::-webkit-scrollbar-track { background: var(--bg-tertiary); }
.nd-app ::-webkit-scrollbar-thumb { background: var(--border-primary); border-radius: 6px; }
@container (max-width: 560px) { .nd-prev { display: none; } }
/* highlight.js — the app loads github.min.css (light) or github-dark.min.css (dark) */
.nd-app[data-type="light"] { --h-kw:#d73a49; --h-str:#032f62; --h-com:#6a737d; --h-title:#6f42c1; --h-bi:#e36209; --h-num:#005cc5; }
.nd-app[data-type="dark"]  { --h-kw:#ff7b72; --h-str:#a5d6ff; --h-com:#8b949e; --h-title:#d2a8ff; --h-bi:#ffa657; --h-num:#79c0ff; }
.hljs-keyword { color: var(--h-kw); } .hljs-string { color: var(--h-str); } .hljs-comment { color: var(--h-com); font-style: italic; }
.hljs-title { color: var(--h-title); } .hljs-built_in { color: var(--h-bi); } .hljs-number { color: var(--h-num); }
/* Status + shadows demo */
.tokens { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.nd-tokens { padding: 18px; border-radius: 10px; border: 1px solid var(--border-primary); background: var(--bg-primary); color: var(--text-primary); font-family: system-ui, sans-serif; }
.nd-tokens .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
.nd-alert { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 8px; background: var(--bg-secondary); border: 1px solid var(--border-secondary); }
.nd-alert i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.nd-shadow { padding: 14px; border-radius: 10px; background: var(--bg-secondary); border: 1px solid var(--border-secondary); font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; }
.nd-btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.nd-btn2 { padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border-primary); background: var(--bg-tertiary); color: var(--text-primary); font-size: 13px; cursor: pointer; }
.nd-btn2:hover { background: var(--bg-hover); } .nd-btn2:active { background: var(--bg-active); }
/* ============================================================
   markdown-preview.css (verbatim from the repo)
   ============================================================ */
/*
 * Markdown preview styles — single source of truth for:
 *   - the in-app preview pane (frontend/index.html)
 *   - HTML export and public shared notes (backend/export.py)
 *
 * Keep element styling here. App chrome (editor, graph, search highlights)
 * and export chrome (print toolbar, copy buttons) stay in their own files.
 */

.markdown-preview {
    line-height: 1.8;
    color: var(--text-primary);
    font-size: 16px;
}

/* Readable line length - constrain text width for better readability */
.markdown-preview.readable-width {
    max-width: 750px;
    margin-left: auto;
    margin-right: auto;
}

/* Remove top margin from first element */
.markdown-preview > *:first-child {
    margin-top: 0 !important;
}

/* Headings */
.markdown-preview h1 {
    font-size: 2.25rem;
    font-weight: 700;
    margin-top: 2rem;
    margin-bottom: 1rem;
    color: var(--text-primary);
    border-bottom: 2px solid var(--border-primary);
    padding-bottom: 0.5rem;
}
.markdown-preview h2 {
    font-size: 1.875rem;
    font-weight: 700;
    margin-top: 1.75rem;
    margin-bottom: 0.875rem;
    color: var(--text-primary);
    border-bottom: 1px solid var(--border-primary);
    padding-bottom: 0.3rem;
}
.markdown-preview h3 {
    font-size: 1.5rem;
    font-weight: 600;
    margin-top: 1.5rem;
    margin-bottom: 0.75rem;
    color: var(--text-primary);
}
.markdown-preview h4 {
    font-size: 1.25rem;
    font-weight: 600;
    margin-top: 1.25rem;
    margin-bottom: 0.625rem;
    color: var(--text-primary);
}
.markdown-preview h5 {
    font-size: 1.125rem;
    font-weight: 600;
    margin-top: 1rem;
    margin-bottom: 0.5rem;
    color: var(--text-primary);
}
.markdown-preview h6 {
    font-size: 1rem;
    font-weight: 600;
    margin-top: 1rem;
    margin-bottom: 0.5rem;
    color: var(--text-secondary);
}

/* Paragraphs and text */
.markdown-preview p {
    margin-top: 0;
    margin-bottom: 1rem;
    line-height: 1.7;
}

.markdown-preview strong {
    font-weight: 600;
    color: var(--text-primary);
}

.markdown-preview em {
    font-style: italic;
}

/* Lists */
.markdown-preview ul, .markdown-preview ol {
    margin-top: 0;
    margin-bottom: 1rem;
    margin-left: 1.5rem;
    padding-left: 0.5rem;
}
/* Nested unordered lists: disc → circle → square (common editor convention) */
.markdown-preview ul { list-style-type: disc; }
.markdown-preview ul ul { list-style-type: circle; }
.markdown-preview ul ul ul { list-style-type: square; }
.markdown-preview ol { list-style-type: decimal; }
.markdown-preview li {
    margin-bottom: 0.5rem;
    line-height: 1.6;
}
.markdown-preview li > ul,
.markdown-preview li > ol {
    margin-top: 0.5rem;
    margin-bottom: 0.5rem;
}

/* Inline code */
.markdown-preview code:not(pre code) {
    background-color: var(--bg-tertiary);
    color: var(--accent-primary);
    padding: 0.2rem 0.4rem;
    border-radius: 0.25rem;
    font-size: 0.875rem;
    font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
    font-weight: 500;
}

/* Code blocks */
.markdown-preview pre {
    background-color: var(--bg-tertiary);
    margin-top: 0;
    margin-bottom: 1.5rem;
    border-radius: 0.5rem;
    overflow-x: auto;
    border: 1px solid var(--border-primary);
}
.markdown-preview pre code {
    background: transparent;
    padding: 1rem;
    display: block;
    font-size: 0.875rem;
    line-height: 1.6;
    font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
}

/* Blockquotes */
.markdown-preview blockquote {
    border-left: 4px solid var(--accent-primary);
    padding-left: 1rem;
    margin: 1.5rem 0;
    font-style: italic;
    color: var(--text-secondary);
    background-color: var(--bg-tertiary);
    padding: 1rem;
    padding-left: 1rem;
    border-radius: 0.25rem;
}
.markdown-preview blockquote p {
    margin-bottom: 0;
}

/* Links */
.markdown-preview a {
    color: var(--accent-primary);
    text-decoration: underline;
    text-decoration-color: transparent;
    transition: text-decoration-color 0.2s;
    cursor: pointer;
}
.markdown-preview a:hover {
    text-decoration-color: var(--accent-primary);
}

/* Wikilinks - Obsidian style internal links */
.markdown-preview a[data-wikilink] {
    color: var(--link-internal, var(--accent-primary));
    text-decoration: none;
    font-weight: 500;
    background-color: var(--link-internal-bg, transparent);
    padding: 0 2px;
    border-radius: 2px;
    transition: background-color 0.15s, color 0.15s;
}
.markdown-preview a[data-wikilink]:hover {
    background-color: var(--link-internal-hover-bg, var(--bg-tertiary));
    text-decoration: underline;
}

/* Broken wikilinks - note doesn't exist (Obsidian shows these dimmed) */
.markdown-preview a[data-wikilink].wikilink-broken {
    color: var(--link-broken, var(--text-tertiary));
    opacity: 0.7;
}
.markdown-preview a[data-wikilink].wikilink-broken:hover {
    opacity: 1;
}

/* Standard internal links (non-wikilink, e.g. [text](path)) */
.markdown-preview a:not([href^="http"]):not([href^="https"]):not([href^="//"]):not([href^="mailto:"]):not([data-wikilink]) {
    color: var(--accent-primary);
}

/* Tables */
.markdown-preview table {
    width: 100%;
    margin-top: 0;
    margin-bottom: 1.5rem;
    border-collapse: collapse;
    border: 1px solid var(--border-primary);
}
.markdown-preview th, .markdown-preview td {
    border: 1px solid var(--border-primary);
    padding: 0.75rem 1rem;
    text-align: left;
}
.markdown-preview th[align="left"],   .markdown-preview td[align="left"]   { text-align: left; }
.markdown-preview th[align="right"],  .markdown-preview td[align="right"]  { text-align: right; }
.markdown-preview th[align="center"], .markdown-preview td[align="center"] { text-align: center; }
.markdown-preview th {
    background-color: var(--bg-tertiary);
    font-weight: 600;
    color: var(--text-primary);
}
.markdown-preview tr:nth-child(even) {
    background-color: var(--bg-secondary);
}

/* Horizontal rule */
.markdown-preview hr {
    border: none;
    border-top: 2px solid var(--border-primary);
    margin: 2rem 0;
}

/* Images */
.markdown-preview img {
    max-width: 100%;
    height: auto;
    border-radius: 0.5rem;
    margin: 1rem 0;
}

/* Embedded Media (audio, video, PDF) */
.markdown-preview .media-embed {
    margin: 1.5rem 0;
    border-radius: 0.5rem;
    overflow: hidden;
}

/* Audio embeds */
.markdown-preview .media-audio {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1.5rem;
    background: linear-gradient(135deg, var(--bg-tertiary) 0%, var(--bg-secondary) 100%);
    border: 1px solid var(--border-primary);
}
.markdown-preview .media-audio audio {
    width: 100%;
    max-width: 500px;
    border-radius: 2rem;
}
.markdown-preview .media-audio .media-caption {
    margin-top: 0.75rem;
    font-size: 0.875rem;
    color: var(--text-secondary);
}

/* Video embeds */
.markdown-preview .media-video {
    background: #000;
    display: flex;
    justify-content: center;
}
.markdown-preview .media-video video {
    width: 100%;
    max-width: 800px;
    max-height: 450px;
    border-radius: 0;
}

/* PDF embeds (iframe) */
.markdown-preview .media-pdf {
    border: 1px solid var(--border-primary);
    border-radius: 0.5rem;
    overflow: hidden;
    background: var(--bg-secondary);
}
.markdown-preview .media-pdf iframe {
    width: 100%;
    height: 600px;
    border: none;
    display: block;
}

/* PDF links (for external PDFs) */
.markdown-preview .pdf-link {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    padding: 1rem 1.25rem;
    margin: 1rem 0;
    background: linear-gradient(135deg, var(--bg-tertiary) 0%, var(--bg-secondary) 100%);
    border: 1px solid var(--border-primary);
    border-radius: 0.5rem;
    color: var(--text-primary);
    text-decoration: none;
    transition: all 0.15s ease;
}
.markdown-preview .pdf-link:hover {
    background: var(--bg-secondary);
    border-color: var(--accent-primary);
    transform: translateY(-1px);
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.markdown-preview .pdf-link:hover .pdf-link-content {
    color: var(--accent-primary);
}
.markdown-preview .pdf-link-content {
    font-weight: 600;
    color: var(--text-primary);
}
.markdown-preview .pdf-link-note {
    font-size: 0.75rem;
    color: var(--text-secondary);
}

/* Callouts — GitHub-style admonitions (> [!NOTE], etc.) */
.markdown-preview .callout {
    margin: 1rem 0;
    padding: 0.75rem 1rem;
    border-left: 4px solid var(--callout-color, var(--accent-primary));
    border-radius: 0.375rem;
    background: var(--callout-bg, var(--bg-secondary));
}
.markdown-preview .callout-title {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-weight: 600;
    color: var(--callout-color, var(--accent-primary));
    margin-bottom: 0.25rem;
}
.markdown-preview .callout-icon {
    font-size: 1.1em;
    line-height: 1;
}
.markdown-preview .callout-body > :first-child { margin-top: 0; }
.markdown-preview .callout-body > :last-child  { margin-bottom: 0; }
.markdown-preview .callout-note      { --callout-color: #0969da; --callout-bg: rgba(9, 105, 218, 0.08); }
.markdown-preview .callout-tip       { --callout-color: #1a7f37; --callout-bg: rgba(26, 127, 55, 0.08); }
.markdown-preview .callout-important { --callout-color: #8250df; --callout-bg: rgba(130, 80, 223, 0.08); }
.markdown-preview .callout-warning   { --callout-color: #9a6700; --callout-bg: rgba(154, 103, 0, 0.08); }
.markdown-preview .callout-caution   { --callout-color: #d1242f; --callout-bg: rgba(209, 36, 47, 0.08); }

/* Task lists */
.markdown-preview input[type="checkbox"] {
    margin-right: 0.5rem;
}
/* Exports keep them disabled, so only the live preview gets the affordance */
.markdown-preview input[type="checkbox"]:not([disabled]) {
    cursor: pointer;
}
/* Loose lists (a blank line anywhere in them) wrap item content in a <p>,
   so both shapes need covering or the bullet reappears next to the box. */
.markdown-preview li:has(> input[type="checkbox"]),
.markdown-preview li:has(> p > input[type="checkbox"]) {
    list-style: none;
    margin-left: -1.25rem;
}

/* Math/LaTeX styling */
.markdown-preview .MathJax {
    color: var(--text-primary);
    overflow-x: auto;
    overflow-y: hidden;
}

/* Display math (block) */
.markdown-preview mjx-container[display="true"] {
    margin: 1.5rem 0;

}

/* Inline math */
.markdown-preview mjx-container[display="false"] {

function buildApp(){

      <div class="nd-row note-item" data-v="--text-primary">⭐ Roadmap<span class="meta" data-v="--text-tertiary">2d</span></div>
      <div class="nd-sec" data-v="--text-tertiary">Notes</div>
      <div class="nd-row folder-item folder-expanded" data-v="--text-primary">📂 Projects</div>
      <div class="nd-row indent note-item active" data-v="--accent-light --accent-primary --text-primary">📄 Welcome</div>
      <div class="nd-row indent note-item is-hover" data-v="--bg-hover --accent-primary --text-primary">📄 Meeting notes <span class="meta" data-v="--text-tertiary">hover</span></div>
      <div class="nd-row indent note-item" data-v="--text-primary">📄 Ideas</div>
      <div class="nd-row folder-item" data-v="--text-primary">📁 Journal</div>
      <div class="nd-row" style="gap:4px;flex-wrap:wrap;padding-top:10px"><span class="nd-tag" data-v="--accent-light --accent-primary">#demo</span><span class="nd-tag" data-v="--accent-light --accent-primary">#notes</span></div>
    </div>
  </div>
  <div class="nd-main">
    <div class="nd-toolbar" data-v="--bg-secondary --border-primary">
      <span class="title" data-v="--text-primary">Welcome.md</span>
      <button class="format-btn" data-v="--text-secondary"><b>B</b></button><button class="format-btn" data-v="--text-secondary"><i>I</i></button><button class="format-btn" data-v="--text-secondary">&lt;/&gt;</button><button class="format-btn" data-v="--text-secondary">🔗</button>

      <div class="nd-alert"><i style="background:var(--warning)" data-v="--warning"></i><span style="color:var(--warning)" data-v="--warning">Note is very long</span></div>
      <div class="nd-alert"><i style="background:var(--error)" data-v="--error"></i><span style="color:var(--error)" data-v="--error">Could not delete note</span></div></div>
    <div><div class="nd-btnrow" style="margin-bottom:10px"><button class="nd-new" style="padding:6px 12px;font-size:13px">Primary</button><button class="nd-btn2">Secondary</button><button class="nd-btn2" style="background:var(--bg-active)">Active</button></div>
      <div class="nd-btnrow"><span class="nd-tag">tag</span><a href="#" style="color:var(--accent-primary)">link</a><span style="color:var(--text-secondary)">secondary</span><span style="color:var(--text-tertiary)">tertiary</span></div></div>

}
function renderPreview(){
  const t=curType(); app.dataset.type=t; document.getElementById('tokens').dataset.type=t;
  document.getElementById('tokens').style.cssText='';
  const targets=[app, document.getElementById('tokens')];
  targets.forEach(n=>{
    REQUIRED.forEach(k=>n.style.setProperty(k,S.vars[k]));
    GROUPS.filter(g=>g.optional).forEach(g=>g.vars.forEach(([k])=>{ S.optional[k] ? n.style.setProperty(k,S.vars[k]) : n.style.removeProperty(k); }));
  });
  document.getElementById('typeBadge').textContent = (S.typeMode==='auto'?'auto-detected: ':'')+t;
}

/* ---------- export ---------- */
function buildCss(){
  const V=S.vars, t=curType(), id=S.id||'my-theme', L=[];
  L.push(`/* @theme-type: ${t} */`);
  L.push(`/* ${S.name||titleCase(id)} - made with NoteDiscovery Theme Creator */`);
  if(S.desc) L.push(`/* ${S.desc.replace(/\*\//g,'')} */`);
  L.push('', `:root[data-theme="${id}"] {`);
  const notes={'--bg-primary':'Main background','--bg-secondary':'Sidebar/secondary areas','--bg-tertiary':'Tertiary backgrounds','--bg-hover':'Hover state','--bg-active':'Active/pressed state','--text-primary':'Main text','--text-secondary':'Secondary text','--text-tertiary':'Muted/tertiary text','--border-primary':'Main borders','--border-secondary':'Subtle borders','--accent-primary':'Links, buttons, highlights','--accent-hover':'Accent hover state','--accent-light':'Accent background','--success':'Success messages','--error':'Error messages','--warning':'Warning messages','--syntax-bold':'Bold in editor','--syntax-italic':'Italic in editor','--link-color':'Links in editor','--link-internal':'[[Wikilinks]]','--link-broken':'Broken wikilinks'};
  GROUPS.forEach(g=>{
    const vars=g.vars.filter(([k])=>!g.optional||S.optional[k]); if(!vars.length) return;
    L.push(`    /* ${g.cmt} */`);
    vars.forEach(([k])=>L.push(`    ${k}: ${V[k]};`.padEnd(40)+`/* ${notes[k]} */`));
    L.push('');
  });
  L.push('    /* Shadows */'); ['--shadow-sm','--shadow-md','--shadow-lg'].forEach(k=>L.push(`    ${k}: ${V[k]};`));
  L.push('}','');
  return L.join('\n');
}
function validate(){
  const out=[], id=S.id, V=S.vars;
  if(!id) out.push(['err','Theme ID is empty.']); else if(!/^[a-z0-9][a-z0-9_-]*$/.test(id)) out.push(['err','Theme ID should be lowercase letters, digits and hyphens.']);
  else if(PRESETS.some(p=>p.id===id)) out.push(['warn',`"${id}" is a built-in theme ID — the file would override it. Rename to keep both.`]);
  REQUIRED.forEach(k=>{ const bad=!V[k] || (k.startsWith('--shadow')?false:!parseColor(V[k])); if(bad) out.push(['err',`${k} is missing or not a valid colour.`]); });
  const bg=parseColor(V['--bg-primary']), tp=parseColor(V['--text-primary']);
  if(bg&&tp){ const r=contrast(tp,bg); if(r<4.5) out.push(['warn',`Primary text contrast is ${r.toFixed(1)}:1 (AA needs 4.5).`]); }
  if(bg){ const ts=parseColor(V['--text-secondary']); if(ts&&contrast(ts,bg)<4.5) out.push(['warn',`Secondary text contrast is ${contrast(ts,bg).toFixed(1)}:1.`]); }
  const ac=parseColor(V['--accent-primary']); if(ac&&contrast({r:255,g:255,b:255},ac)<3) out.push(['warn','White text on the accent colour is hard to read (buttons use white text).']);
  if(!out.some(o=>o[0]==='err')) out.unshift(['ok','All 19 required variables are present and valid.']);
  out.push(['ok',`Type: ${curType()} (written as @theme-type).`]);
  return out;
}
function renderExport(){
  const css=buildCss(), id=S.id||'my-theme';
  document.getElementById('cssOut').textContent=css;
  document.getElementById('fname').textContent=id+'.css';
  document.getElementById('fhint').textContent='data-theme matches the file name';
  document.getElementById('issues').innerHTML = validate().map(([c,m])=>`<li class="${c==='ok'?'':c}">${m.replace(/</g,'&lt;')}</li>`).join('');
  const icon = S.icon && S.icon!=='🎨' ? `<li>(Optional) icon — in <code>backend/themes.py</code> add to <code>theme_icons</code>:<div class="code" style="margin:4px 0;user-select:all">"${id}": "${S.icon}"</div></li>` : '';
  document.getElementById('steps').innerHTML = `<li>Save the file as <code>themes/${id}.css</code> in your NoteDiscovery folder (the file name must equal the <code>data-theme</code> value).</li>${icon}
    <li>Restart the app (<code>docker-compose restart</code>, or stop and re-run locally). It then appears in <b>Settings → Theme</b> as “${(S.icon||'🎨')} ${titleCase(id)}”.</li>
    <li>(Optional) make it the default for new browsers: <code>ui.default_theme: ${id}</code> in <code>config.yaml</code>.</li>`;
}
function download(name,text,type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),1600); }

/* ---------- import ---------- */
function importText(txt, filename=''){
  txt=txt.trim();
  if(txt[0]==='{'){ try{ const j=JSON.parse(txt); if(!j.vars||!REQUIRED.every(k=>k in j.vars)) throw 0; S=j; return true; }catch(e){ toast('Not a valid project file'); return false; } }
  const vars={}; for(const [,k,v] of txt.matchAll(/(--[a-z0-9-]+)\s*:\s*([^;]+);/g)) vars[k]=v.trim();
  const miss=REQUIRED.filter(k=>!(k in vars)); if(miss.length){ toast('Missing: '+miss.slice(0,3).join(', ')+(miss.length>3?'…':'')); return false; }
  const tm=/@theme-type:\s*(light|dark)/.exec(txt), idm=/data-theme="([^"]+)"/.exec(txt), nm=/\/\*\s*([^*@]+?)\s*(?:-|—|\*\/)/.exec(txt);
  const id=idm?idm[1]:slug(filename.replace(/\.css$/,''))||'imported';
  const type=tm?tm[1]:'dark';
  const p={id,name:(nm&&nm[1].length<40?nm[1]:titleCase(id)),icon:(PRESETS.find(x=>x.id===id)||{}).icon||'🎨',type,vars};
  S=loadPreset(p,{name:p.name,id,icon:p.icon}); S.typeMode=tm?type:'auto'; return true;
}

/* ---------- commit / init ---------- */
function commit(full){ renderPreview(); syncSide(!!full); save(); if(document.getElementById('dlg').open) renderExport(); }
function fullRebuild(){ buildSide(); commit(true); }
(function init(){
  const sel=document.getElementById('presetSel');
  sel.innerHTML='<option value="">Start from…</option>'+PRESETS.map(p=>`<option value="${p.id}">${p.icon} ${p.name} (${p.type})</option>`).join('');
  sel.onchange=()=>{ const p=PRESETS.find(x=>x.id===sel.value); if(!p) return; S=loadPreset(p); sel.value=''; fullRebuild(); toast('Loaded '+p.name); };
  document.getElementById('btnReset').onclick=()=>{ if(confirm('Discard the current theme and start over?')){ S=freshState(); applyShadows(); fullRebuild(); } };
  document.getElementById('btnImport').onclick=()=>document.getElementById('fileIn').click();
  document.getElementById('fileIn').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; const ok=importText(await f.text(), f.name); e.target.value=''; if(ok){ fullRebuild(); toast('Imported '+f.name); } };
  const dlg=document.getElementById('dlg');
  document.getElementById('btnExport').onclick=()=>{ renderExport(); dlg.showModal(); };
  document.getElementById('dlgClose').onclick=()=>dlg.close();
  dlg.addEventListener('click',e=>{ if(e.target===dlg) dlg.close(); });
  document.getElementById('btnDownload').onclick=()=>{ download((S.id||'my-theme')+'.css', buildCss(), 'text/css'); };
  document.getElementById('btnCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText(buildCss()); toast('CSS copied'); }catch(e){ const r=document.createRange(); r.selectNodeContents(document.getElementById('cssOut')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('Press Ctrl/Cmd+C to copy'); } };
  document.getElementById('btnSaveJson').onclick=()=>download((S.id||'my-theme')+'.project.json', JSON.stringify(S,null,2), 'application/json');
  S = restore() || (()=>{ const s=freshState(); return s; })();
  buildApp(); fullRebuild();
})();
</script>
